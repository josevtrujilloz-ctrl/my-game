<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Little Snake Game</title>
  <style>
    : root {
      color-scheme: light;
      --ink: #284638;
      --green: #a9df87;
      --green-dark: #78b85d;
      --panel: #f5fbef;
      --wall: #718d72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 20%, #ffffff 0, #edf7e8 70%);
      font-family: "Trebuchet MS", system-ui, sans-serif;
    }
    .game { width: min(100%, 620px); text-align: center; }
    h1 { margin: 0 0 5px; font-size: clamp(2rem, 6vw, 2.7rem); letter-spacing: .02em; }
    .hint { margin: 0 0 17px; color: #54715d; }
    .scorebar {
      display: flex; justify-content: space-between; gap: 12px;
      margin: 0 0 10px; font-weight: 700;
    }
    .badge { background: white; border: 1px solid #dcebd4; border-radius: 999px; padding: 7px 13px; }
    .board-frame {
      padding: 9px; border-radius: 17px;
      background: linear-gradient(145deg, #b9cbb7, #718d72);
      box-shadow: inset 3px 3px 5px #eff7eb, inset -4px -5px 8px #526a54, 0 9px 20px #38533b2b;
    }
    canvas {
      width: 100%; height: auto; display: block;
      border-radius: 9px; background: #e8f4dc;
      box-shadow: inset 0 0 0 2px #d4e7ca;
      touch-action: none;
    }
    .controls { margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 999px; padding: 10px 21px;
      color: white; background: #538c52; font: inherit; font-weight: 700;
      cursor: pointer; box-shadow: 0 3px 0 #396d3d;
    }
    button:hover { background: #467e48; }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #396d3d; }
    .status { min-height: 1.5em; margin: 12px 0 0; color: #496851; font-weight: 700; }
    @media (max-width: 430px) { .badge { padding: 6px 9px; font-size: .9rem; } }
  </style>
</head>
<body>
  <main class="game">
    <h1>Little Snake</h1>
    <p class="hint">Use the arrow keys to guide your snake to a snack.</p>
    <div class="scorebar" aria-live="polite">
      <span class="badge">Score: <span id="score">0</span></span>
      <span class="badge">Time: <span id="time">0:00</span></span>
      <span class="badge">Best: <span id="best">0</span></span>
    </div>
    <div class="board-frame">
      <canvas id="board" width="480" height="360" aria-label="Snake game board"></canvas>
    </div>
    <div class="controls">
      <button id="restart" type="button">Restart</button>
      <span>Press an arrow key to start</span>
    </div>
    <p id="status" class="status" aria-live="polite">Ready when you are!</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const scoreLabel = document.getElementById("score");
      const timeLabel = document.getElementById("time");
      const bestLabel = document.getElementById("best");
      const statusLabel = document.getElementById("status");
      const cell = 24;
      const columns = canvas.width / cell;
      const rows = canvas.height / cell;
      const startingLength = 4;
      const stepMs = 125;

      // Each item is a grid square. The head is always the first item.
      let snake, previousSnake, direction, queuedDirection, food, score, best, startedAt, gameOver;
      let lastStep = 0;
      let animationId = 0;

      function resetGame() {
        cancelAnimationFrame(animationId);
        snake = [];
        const startX = Math.floor(columns / 2);
        const startY = Math.floor(rows / 2);
        for (let i = 0; i < startingLength; i++) {
          snake.push({ x: startX - i, y: startY });
        }
        previousSnake = snake.map(part => ({ ...part }));
        direction = { x: 1, y: 0 };
        queuedDirection = direction;
        food = null;
        score = 0;
        startedAt = null;
        gameOver = false;
        lastStep = 0;
        scoreLabel.textContent = score;
        timeLabel.textContent = "0:00";
        statusLabel.textContent = "Ready when you are!";
        placeFood();
        draw();
        animationId = requestAnimationFrame(frame);
      }

      function placeFood() {
        // Build a list of free squares first, so food can never land under the snake.
        const free = [];
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < columns; x++) {
            if (!snake.some(part => part.x === x && part.y === y)) free.push({ x, y });
          }
        }
        food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
      }

      function setDirection(next) {
        if (gameOver) return;
        // Compare with the last accepted direction to reject a direct U-turn.
        if ((next.x === -direction.x && next.y === -direction.y) || (next.x === -queuedDirection.x && next.y === -queuedDirection.y)) return;
        queuedDirection = next;
        if (startedAt === null) {
          startedAt = performance.now();
          lastStep = startedAt;
          statusLabel.textContent = "Go get that snack!";
        }
      }

      function move() {
        // Save old positions so each part can glide to its next square.
        previousSnake = snake.map(part => ({ ...part }));
        direction = queuedDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        // Wall contact ends the game before drawing the next frame.
        if (head.x < 0 || head.x >= columns || head.y < 0 || head.y >= rows) {
          endGame();
          return;
        }
        const eating = food && head.x === food.x && head.y === food.y;
        // Touching any segment, including the tail, ends the game immediately.
        if (snake.some(part => part.x === head.x && part.y === head.y)) {
          endGame();
          return;
        }
        snake.unshift(head);
        if (eating) {
          score += 1;
          scoreLabel.textContent = score;
          best = Math.max(best, score);
          bestLabel.textContent = best;
          placeFood();
          if (!food) { endGame("You filled the whole garden!"); return; }
        } else {
          snake.pop();
        }
      }

      function endGame(message) {
        gameOver = true;
        const elapsed = startedAt === null ? 0 : Math.floor((performance.now() - startedAt) / 1000);
        timeLabel.textContent = formatTime(elapsed);
        statusLabel.textContent = message || "Game over! Press Restart to play again.";
        draw();
      }

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        return minutes + ":" + String(seconds % 60).padStart(2, "0");
      }

      function draw(now = performance.now()) {
        const progress = startedAt === null || gameOver ? 0 : Math.min(1, Math.max(0, (now - lastStep) / stepMs));
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // A quiet checker pattern makes the grid easier to read without drawing lines.
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < columns; x++) {
            if ((x + y) % 2 === 0) {
              ctx.fillStyle = "#e3f0d8";
              ctx.fillRect(x * cell, y * cell, cell, cell);
            }
          }
        }
        if (food) {
          const cx = food.x * cell + cell / 2;
          const cy = food.y * cell + cell / 2;
          ctx.fillStyle = "#ed806c";
          ctx.beginPath(); ctx.arc(cx, cy, cell * .34, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#fff2dc";
          ctx.beginPath(); ctx.arc(cx - 3, cy - 3, 2.5, 0, Math.PI * 2); ctx.fill();
        }
        snake.forEach((part, index) => {
          const inset = index === 0 ? 2 : 3;
          const old = previousSnake[Math.min(index, previousSnake.length - 1)] || part;
          const smoothX = old.x + (part.x - old.x) * progress;
          const smoothY = old.y + (part.y - old.y) * progress;
          const x = smoothX * cell + inset, y = smoothY * cell + inset;
          ctx.fillStyle = index === 0 ? "#91cf72" : "#a9df87";
          ctx.strokeStyle = "#72b45e";
          ctx.lineWidth = 1.5;
          roundRect(ctx, x, y, cell - inset * 2, cell - inset * 2, 7);
          ctx.fill(); ctx.stroke();
          if (index === 0) drawFace(x + (cell - inset * 2) / 2, y + (cell - inset * 2) / 2);
        });
        if (gameOver) {
          ctx.fillStyle = "#244532cc";
          ctx.fillRect(0, canvas.height / 2 - 35, canvas.width, 70);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 22px Trebuchet MS, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Game over", canvas.width / 2, canvas.height / 2 - 4);
          ctx.font = "15px Trebuchet MS, sans-serif";
          const elapsed = startedAt === null ? 0 : Math.floor((performance.now() - startedAt) / 1000);
          ctx.fillText("Pellets: " + score + "   ·   Time: " + formatTime(elapsed) + "   ·   Best: " + best, canvas.width / 2, canvas.height / 2 + 21);
        }
      }

      function roundRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.roundRect(x, y, width, height, radius);
      }

      function drawFace(cx, cy) {
        // Place the eyes and smile toward the direction of travel.
        const forward = direction;
        const side = { x: -forward.y, y: forward.x };
        for (const offset of [-1, 1]) {
          const ex = cx + forward.x * 4 + side.x * 4 * offset;
          const ey = cy + forward.y * 4 + side.y * 4 * offset;
          ctx.fillStyle = "#244532";
          ctx.beginPath(); ctx.arc(ex, ey, 1.7, 0, Math.PI * 2); ctx.fill();
        }
        const mx = cx + forward.x * 7;
        const my = cy + forward.y * 7;
        ctx.strokeStyle = "#426e48"; ctx.lineWidth = 1.4; ctx.lineCap = "round";
        ctx.beginPath();
        if (forward.x !== 0) {
          ctx.moveTo(mx, my - 3); ctx.quadraticCurveTo(mx + forward.x * 2, my, mx, my + 3);
        } else {
          ctx.moveTo(mx - 3, my); ctx.quadraticCurveTo(mx, my + forward.y * 2, mx + 3, my);
        }
        ctx.stroke();
      }

      function frame(now) {
        if (startedAt !== null && !gameOver) {
          const elapsed = Math.floor((now - startedAt) / 1000);
          timeLabel.textContent = formatTime(elapsed);
        }
        if (startedAt !== null && !gameOver && now - lastStep >= stepMs) {
          move();
          lastStep = now;
        }
        draw(now);
        if (!gameOver) animationId = requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", event => {
        const directions = {
          ArrowUp: { x: 0, y: -1 },
          ArrowDown: { x: 0, y: 1 },
          ArrowLeft: { x: -1, y: 0 },
          ArrowRight: { x: 1, y: 0 }
        };
        if (directions[event.key]) {
          event.preventDefault();
          setDirection(directions[event.key]);
        }
      });
      document.getElementById("restart").addEventListener("click", resetGame);

      // The best score lives in memory, so it survives each restart on this page.
      best = 0;
      bestLabel.textContent = best;
      resetGame();
    })();
  </script>
</body>
</html>
